<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rift Runners — transformation preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#070d18;color:#e5f3ff;font:14px system-ui}main{max-width:1280px;margin:auto;padding:20px}h1{font-size:28px;margin:0 0 8px;letter-spacing:-.04em}p{color:#9bb5d0}nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0}button,a{min-height:44px;padding:12px 16px;border:1px solid #5d8da8;border-radius:8px;background:#122c41;color:#bdf9e8;font:700 11px system-ui;text-decoration:none;cursor:pointer}label{padding:12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#0a1018;border:1px solid #51728e;border-radius:12px}small{display:block;color:#a6bfd1;margin-top:12px}@media(max-height:540px){main{padding:10px}h1{font-size:20px}p{margin:5px 0}nav{margin:8px 0}canvas{max-height:calc(100dvh - 150px);object-fit:contain}small{font-size:10px}}
</style></head><body><main><h1>RIFT RUNNERS // SIX LAYERS OF REALITY</h1><p>Audio and graphics preview. In the main game, both evolve after the wave-5, wave-7, wave-10 and wave-15 bosses.</p><nav><button id="before">ORIGINAL GRAPHICS</button><button id="replay">REPLAY SCREEN CRACK</button><button id="after">UPGRADED GRAPHICS</button><button id="frontier">WAVE 7 · FRONTIER</button><button id="sample">PLAY SOUND SAMPLE</button><button id="three">WAVE 10 · 3D</button><button id="replay3d">REPLAY 3D TRANSITION</button><button id="planet">WAVE 15 · PLANET</button><button id="thirdperson">WAVE 20 · THIRD PERSON</button><button id="flight">DEMO FLIGHT</button><label><input id="reduce" type="checkbox"> Reduced motion</label><a href="./">PLAY RIFT RUNNERS ↗</a></nav><canvas id="preview" width="1280" height="720" aria-label="Transformation preview"></canvas><small id="status" role="status">Original graphics · preview does not affect your saved progression.</small><small id="audioStatus">Tap a phase, then play its sound sample.</small></main>
<script src="skill-tree.js?v=1.25.0"></script><script src="progression.js?v=1.25.0"></script><script src="third-person.js?v=1.25.0"></script><script src="sphere-world.js?v=1.25.0"></script><script src="rift-frontier.js?v=1.25.0"></script><script src="rift-models.js?v=1.25.0"></script><script src="arcade-feedback.js?v=1.25.0"></script><script src="rift-visuals.js?v=1.25.0"></script><script src="rift-3d.js?v=1.25.0-render1"></script><script>
const C=document.querySelector('canvas'),X=C.getContext('2d'),status=document.querySelector('#status'),reduce=document.querySelector('#reduce');reduce.checked=matchMedia('(prefers-reduced-motion: reduce)').matches;
const audio=RRFeedback.create();let sampleId=0;document.addEventListener('pointerdown',()=>audio.unlock(),{passive:true});document.addEventListener('keydown',()=>audio.unlock());
let layer=0,left=0,last=0,target=1,fly=false;
const state={W:1280,H:720,t:0,reduced:false,paused:false,players:[{id:0,x:430,y:375,angle:-.35,color:'#7dffd0',hp:90,maxHp:100,shield:20,maxShield:30,weapons:['pistol','rocket','laser','shotgun'].map(id=>({id,tier:2}))},{id:1,x:735,y:475,angle:-2.6,color:'#69cfff',hp:75,maxHp:100,shield:0,weapons:['pistol','rocket','smg'].map(id=>({id,tier:1}))}],enemies:['drone','tank','gunner','charger','splitter','sentinel','runner'].map((type,n)=>({id:n,type,x:180+(n*157)%930,y:150+(n%3)*145,r:type==='tank'||type==='sentinel'?24:17,hp:100,maxHp:100,aim:n*.8,hit:0})),shots:Array.from({length:14},(_,n)=>({x:470+n*25,y:360-n*7,vx:600,vy:-160,r:n%5?3:7,color:n%3?'#a5fff0':'#d8aeff'})),enemyShots:[{x:570,y:265,r:7},{x:610,y:300,r:7},{x:650,y:335,r:7}],effects:[],particles:Array.from({length:20},(_,n)=>({x:880+Math.cos(n)*n*3,y:230+Math.sin(n)*n*3,vx:Math.cos(n)*70,vy:Math.sin(n)*70,life:.45,color:'#cfacff'})),drops:Array.from({length:10},(_,n)=>({x:300+n*47,y:555+Math.sin(n)*22,kind:n===6?'crate':'material'}))};
state.enemies.push({id:99,type:'boss',mirror:true,sourceId:0,x:560,y:330,r:18,hp:300,maxHp:300,color:'#ff6bdd',aim:2.8,shield:20,maxShield:30,weapons:['pistol','rocket','laser','shotgun'].map(id=>({id,tier:2}))});
function classic(){X.fillStyle='#0a1018';X.fillRect(0,0,1280,720);X.strokeStyle='#172333';X.lineWidth=1;for(let a=0;a<1280;a+=64){X.beginPath();X.moveTo(a,0);X.lineTo(a,720);X.stroke();}for(let a=0;a<720;a+=64){X.beginPath();X.moveTo(0,a);X.lineTo(1280,a);X.stroke();}for(const e of state.enemies){X.fillStyle='#ff496c';X.fillRect(e.x-e.r,e.y-e.r,e.r*2,e.r*2);}for(const p of state.players){X.strokeStyle=p.color;X.lineWidth=4;X.beginPath();X.arc(p.x,p.y,15,0,Math.PI*2);X.stroke();X.fillStyle=p.color;X.fillRect(p.x+5,p.y-4,23,8);}for(const s of state.shots){X.fillStyle='#68f7c2';X.beginPath();X.arc(s.x,s.y,4,0,7);X.fill();}}
document.querySelector('#before').onclick=()=>{layer=0;left=0;status.textContent='Original graphics · schematic preview.';};document.querySelector('#after').onclick=()=>{layer=1;left=0;status.textContent='Layer II · actual upgraded renderer used during gameplay.';};document.querySelector('#replay').onclick=()=>{target=1;layer=0;left=3;status.textContent='Reality fracturing…';};
document.querySelector('#frontier').onclick=()=>{layer=1.5;left=0;};document.querySelector('#sample').onclick=()=>{audio.unlock();audio.setMuted(false);audio.setTier(layer);audio.event({id:++sampleId,kind:'shotgun'},1,reduce.checked,{x:-250,y:-100});setTimeout(()=>audio.event({id:++sampleId,kind:'blast'},1,reduce.checked,{x:250,y:150}),300);};
document.querySelector('#three').onclick=()=>{target=2;layer=2;left=0;};
document.querySelector('#replay3d').onclick=()=>{target=2;layer=1;left=3;status.textContent='Dimensions fracturing…';};
document.querySelector('#planet').onclick=()=>{target=3;layer=2;left=3;fly=true;};
document.querySelector('#thirdperson').onclick=()=>{layer=target=4;left=0;fly=false;state.players.forEach((p,i)=>Object.assign(p,{x:i*180,y:i*-90,angle:-Math.PI/2,cameraAngle:-Math.PI/2,character:i?'bulwark':'ranger'}));state.enemies.forEach((e,i)=>Object.assign(e,{x:(i-3)*110,y:-350-(i%3)*160}));state.shots=[];state.enemyShots=[];state.drops=[];state.particles=[];};
document.querySelector('#flight').onclick=()=>{fly=!fly;};
function frame(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(left>0){left=Math.max(0,left-dt);if(left<=1.6)layer=target;if(!left)status.textContent='Layer II unlocked · this style stays for the rest of the run.';}audio.setTier(layer,true);document.querySelector('#audioStatus').textContent='Audio '+(audio.stage+1)+' · '+audio.name+' · '+(audio.active?'audio ready':'tap to enable audio');state.frontier=layer===1.5||layer===2;state.fieldCamera={x:640,y:360};state.worldSeed=7;state.t=t/1000;state.reduced=reduce.checked;state.third=layer===4;state.sphere=layer===3;state.focus=state.players[0];if(layer===3&&fly){const p=state.players[0],a=p.cameraAngle||0,vx=65*Math.cos(a)-18*Math.sin(a),vy=65*Math.sin(a)+18*Math.cos(a),at=RRSphere.step({...p,angle:a},vx,vy,dt);p.x=at.x;p.y=at.y;p.cameraAngle=at.angle;p.angle=Math.atan2(18,65)+at.angle;}if(layer>=2){const ok=Rift3D.draw(X,state);if(!ok)RiftVisual.draw(X,state);status.textContent=ok?(layer===4?'Layer VI · third-person arena · ':layer===3?'Layer V · mesh models · looping planet · ':'Layer IV · ')+Rift3D.backend+' 3D renderer'+(Rift3D.reason?' · '+Rift3D.reason:''):'WebGL unavailable · enhanced 2D fallback';}else if(layer)RiftVisual.draw(X,state);else classic();RiftVisual.fracture(X,left,reduce.checked,1280,720,target);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></body></html>
