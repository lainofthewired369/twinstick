name: Real peer-to-peer integration
on:
  push:
    paths:
      - '*.js'
      - '*.cjs'
      - 'rtc-bridge.py'
      - '.github/workflows/rtc.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-webrtc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install aiortc==1.15.0
      - run: node tests.cjs
      - run: node real-rtc-tests.cjs
